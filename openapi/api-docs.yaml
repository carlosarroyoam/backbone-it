components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          description: User's email address
          type: string
        password:
          description: User's password
          type: string
        device_fingerprint:
          description: Device fingerprint used to identify the client device
          type: string
      required:
        - email
        - password
        - device_fingerprint

    RefreshTokenRequest:
      type: object
      properties:
        device_fingerprint:
          description: Device fingerprint used to identify the client device
          type: string
      required:
        - device_fingerprint

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          description: User's email address
          type: string
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        password:
          description: New password for the user account
          type: string
        confirm_password:
          description: Confirmation of the new password
          type: string
      required:
        - password
        - confirm_password

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          description: User's current password
          type: string
        new_password:
          description: New password for the user account
          type: string
        confirm_password:
          description: Confirmation of the new password
          type: string
      required:
        - current_password
        - new_password
        - confirm_password

    CreateApiKeyRequest:
      type: object
      description: Request body for creating a new API key
      required:
        - name
      properties:
        name:
          type: string
          description: API key name
        expires_in_days:
          type: integer
          description: Number of days until the API key expires

    PagedUsersResponse:
      type: object
      description: Paginated list of users response
      properties:
        items:
          type: array
          description: List of users
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          description: Pagination metadata
          $ref: "#/components/schemas/PaginationResponse"

    PagedCustomersResponse:
      type: object
      description: Paginated response containing a list of customers and pagination metadata
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Customer records for the current page
          items:
            $ref: "#/components/schemas/CustomerResponse"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
          description: Pagination metadata for the current result set

    PagedServicePlanResponse:
      type: object
      description: Paginated response containing a list of service plans and pagination metadata
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Service plans for the current page
          items:
            $ref: "#/components/schemas/ServicePlanResponse"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
          description: Pagination metadata for the current result set

    PagedSubscriptionResponse:
      type: object
      description: Paginated response containing a list of subscriptions and pagination metadata
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Subscriptions for the current page
          items:
            $ref: "#/components/schemas/SubscriptionResponse"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
          description: Pagination metadata for the current result set

    PagedTowerResponse:
      type: object
      description: Paginated response containing a list of towers and pagination metadata
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Towers for the current page
          items:
            $ref: "#/components/schemas/TowerResponse"
        pagination:
